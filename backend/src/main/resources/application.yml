server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: smart-health-monitoring-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

ml-service:
  url: ${ML_SERVICE_URL:http://localhost:8000/api/ml/predict}
  health-url: ${ML_SERVICE_HEALTH_URL:http://localhost:8000/health}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method